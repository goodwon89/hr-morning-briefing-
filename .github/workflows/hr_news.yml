name: 인재경영실 Morning Briefing 자동 발송

on:
  schedule:
    # GitHub 예약 실행은 매시 정각에 몰려 지연되므로 정각을 피해 2회 예약합니다.
    # 같은 날 두 번째 실행은 '이미 발송됨'을 확인하고 바로 종료합니다(중복 발송 없음).
    - cron: '47 20 * * 0-4'   # 05:47 KST 1차 (06:30까지 대기 후 발송)
    - cron: '17 22 * * 0-4'   # 07:17 KST 2차 (1차가 누락·지연된 경우 대비)
  repository_dispatch:        # 외부 스케줄러(cron-job.org 등)에서 정시 호출용
    types: [morning-briefing]
  workflow_dispatch:          # GitHub 웹에서 수동 실행
    inputs:
      dry_run:
        description: '테스트 발송 (발신 계정에만, 아카이브 저장 안 함)'
        type: boolean
        default: true
      force_send:
        description: '공휴일·중복 발송 확인을 무시하고 전체 발송'
        type: boolean
        default: false

concurrency:                  # 여러 트리거가 겹쳐도 한 번에 하나씩 실행
  group: morning-briefing
  cancel-in-progress: false

jobs:
  hr-news:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write          # archive/*.json 저장

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 · 발송
        env:
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_RECIPIENTS:  ${{ secrets.EMAIL_RECIPIENTS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 선택: 없으면 규칙 기반 선별
          ANTHROPIC_MODEL:   ${{ vars.ANTHROPIC_MODEL }}        # 선택: 모델 변경 시 Variables에 등록
          TRACK_URL:         ${{ vars.TRACK_URL }}              # 선택: 운영 웹앱 주소 (클릭 추적·구독 관리)
          TRACK_SECRET:      ${{ secrets.TRACK_SECRET }}        # 선택: 운영 웹앱 비밀키
          KOSIS_API_KEY:     ${{ secrets.KOSIS_API_KEY }}       # 선택: 고용동향 지표 자동 갱신
          GITHUB_OWNER:      ${{ github.repository_owner }}
          GITHUB_REPO:       ${{ github.event.repository.name }}
          DRY_RUN:           ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FORCE_SEND:        ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
        run: python hr_news.py

      - name: 아카이브 커밋
        if: always()           # 발송 후 단계에서 실패해도 발송 기록은 남겨 중복 발송을 막음
        run: |
          git add archive data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update news archive $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
