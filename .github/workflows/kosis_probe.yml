name: KOSIS 통계표 점검 (수동)
on:
  workflow_dispatch:
    inputs:
      tables:
        description: '통계표 ID (공백 구분)'
        default: 'DT_1DA7002S DT_1DA7001S'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python scripts/kosis_probe.py ${{ inputs.tables }}
